<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Alessia Pianetta</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="icon" href="assets/images/favicon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=4">
</head>

<body>
  <nav class="navbar navbar-expand-md" data-bs-theme="dark" aria-label="Main navigation">
    <a href="index.html" class="logo" aria-label="Alessia Pianetta home">
      <span class="corner top-left"></span>
      <span class="corner bottom-right"></span>
      <span class="logo-text">A:P</span>
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#primary-navigation"
      aria-controls="primary-navigation"
      aria-expanded="false"
      aria-label="Open navigation menu"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-end" id="primary-navigation">
      <div class="nav-links">
        <a class="nav-link" href="index.html#home">Home</a>
        <a class="nav-link" href="index.html#about">About me</a>
        <a class="nav-link" href="index.html#projects">Portfolio</a>
        <a class="nav-link" href="Cv.html">CV</a>
        <a class="nav-link active" href="contacts.html">Contacts</a>
      </div>
    </div>
  </nav>

  <main>
    <section class="contact-page">
      <div class="contact-intro">
        <h1 class="contact-title">Contact me</h1>
        <p class="contact-subtitle">
          Crack the problem. Clear the noise. Check it off!
        </p>
      </div>

      <div class="contact-box">
        <form class="contact-form" id="contact-form">
          <div class="form-field">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" autocomplete="name" required>
          </div>

          <div class="form-field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
          </div>

          <div class="form-field">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" required>
          </div>

          <div class="form-field">
            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
          </div>

          <button type="submit">Send</button>

          <p
            id="form-status"
            class="form-status"
            role="status"
            aria-live="polite"
          ></p>
        </form>
      </div>
    </section>
  </main>

  <footer>
    <p>Designed &amp; coded by Alessia Pianetta</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <script>
    emailjs.init({
      publicKey: "94LanndGJ1g3kHj01"
    });

    const contactForm = document.getElementById("contact-form");
    const formStatus = document.getElementById("form-status");

    contactForm.addEventListener("submit", function (event) {
      event.preventDefault();

      const submitButton = contactForm.querySelector('button[type="submit"]');

      submitButton.disabled = true;
      submitButton.textContent = "Sending...";
      formStatus.className = "form-status is-sending";
      formStatus.textContent = "Sending your message…";
      contactForm.setAttribute("aria-busy", "true");

      emailjs
        .sendForm(
          "service_f4ejtzg",
          "template_db0syoy",
          contactForm
        )
        .then(() => {
          formStatus.className = "form-status is-success";
          formStatus.textContent = "Message sent — I’ll get back to you soon.";
          contactForm.reset();
        })
        .catch(() => {
          formStatus.className = "form-status is-error";
          formStatus.textContent = "Oops, something went wrong. Please try again.";
        })
        .finally(() => {
          submitButton.disabled = false;
          submitButton.textContent = "Send";
          contactForm.removeAttribute("aria-busy");
        });
    });
  </script>
</body>
</html>
